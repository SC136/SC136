name: Refresh README counters

# The visitor, Discord and follower chips are images with the numbers drawn in,
# so they are redrawn on a schedule and committed only when a number changed.
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  counters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools
      - run: python tools/m3chips.py counters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if a number changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/m3
          git diff --cached --quiet || (git commit -m "Refresh README counters" && git push)
