<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Konnichiwa, I'm Swar</title>
  <desc id="desc">Developer, hobbyist and anime enjoyer. A black torii gate stands in front of a red sun while petals fall.</desc>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }

    .kicker  { font-size: 22px; font-weight: 600; fill: #c1121f; letter-spacing: 1px; animation: rise .8s ease .1s both; }
    .name    { fill: #111318; stroke: #111318; stroke-width: 1.2px; stroke-linejoin: round;
               stroke-dasharray: 1; animation: draw 1.8s ease .3s both, fillIn .8s ease 1.3s both; }
    .tagline { font-size: 27px; fill: #3b3f48; animation: rise .8s ease 1.6s both; }
    .prompt  { font-size: 19px; fill: #6b6f78; animation: rise .8s ease 2s both; }

    .word    { font-size: 19px; fill: #c1121f; opacity: 0; animation: cycle 12.5s ease infinite both; }
    .caret   { animation: blink 1s steps(1) infinite; }

    .star    { fill: #fff; animation: twinkle 4s ease-in-out infinite alternate; }
    .halo    { animation: pulse 6s ease-in-out infinite alternate; }
    .cloud   { fill: #f6f1e9; opacity: .85; animation: drift 14s ease-in-out infinite alternate; }

    .fall    { animation: fall linear infinite both; }
    .spin    { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }

    @keyframes rise    { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes draw    { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fillIn  { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes cycle   { 0% { opacity: 0; transform: translateY(8px); } 3%, 17% { opacity: 1; transform: none; } 20%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes blink   { 50% { fill-opacity: 0; } }
    @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }
    @keyframes pulse   { from { opacity: .2; } to { opacity: .45; } }
    @keyframes drift   { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
    @keyframes fall {
      0%   { transform: translate(0, -20px); opacity: 0; }
      8%   { opacity: .95; }
      25%  { transform: translate(-35px, 60px); }
      50%  { transform: translate(-75px, 150px); }
      75%  { transform: translate(-130px, 240px); }
      92%  { opacity: .95; }
      100% { transform: translate(-175px, 330px); opacity: 0; }
    }
    @keyframes spin {
      0%   { transform: rotate(0deg) scaleX(1); }
      50%  { transform: rotate(180deg) scaleX(.35); }
      100% { transform: rotate(360deg) scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .word { opacity: 0; }
      .word.first { opacity: 1; }
      .fall { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#efe8dc"/>
    </linearGradient>
    <radialGradient id="moonGrad" cx=".4" cy=".36" r=".72">
      <stop offset="0" stop-color="#ff4b5c"/>
      <stop offset=".6" stop-color="#d90429"/>
      <stop offset="1" stop-color="#8d0801"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame">
      <rect width="1000" height="300" rx="18"/>
    </clipPath>
    <path id="petal" d="M0 0C3-5 10-6 14-1C10 4 3 5 0 0Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#sky)"/>

    <!-- moon -->
    <circle class="halo" cx="800" cy="132" r="96" fill="#ff4b5c" filter="url(#blur)"/>
    <circle cx="800" cy="132" r="88" fill="url(#moonGrad)"/>
    <rect class="cloud" x="728" y="150" width="128" height="8" rx="4"/>
    <rect class="cloud" x="776" y="170" width="92"  height="6" rx="3" style="animation-delay:-7s"/>

    <!-- torii -->
    <g fill="#111318">
      <path d="M736 104H754L758 300H732Z"/>
      <path d="M846 104H864L868 300H842Z"/>
      <rect x="708" y="128" width="184" height="12" rx="1"/>
      <rect x="792" y="102" width="16"  height="28"/>
      <path d="M676 70Q800 92 924 70L906 96Q800 116 694 96Z"/>
    </g>
    

    <!-- hill -->
    <path d="M520 300C650 262 880 248 1000 258V300Z" fill="#111318"/>

    <!-- petals -->
    <g fill="#111318">
      <g transform="translate(640 0)"><g class="fall" style="animation-duration:11s;animation-delay:-1s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
      <g transform="translate(720 0) scale(.8)"><g class="fall" style="animation-duration:9s;animation-delay:-4s"><use href="#petal" xlink:href="#petal" class="spin" style="animation-duration:2.4s"/></g></g>
      <g transform="translate(805 0)"><g class="fall" style="animation-duration:12s;animation-delay:-7s"><use href="#petal" xlink:href="#petal" class="spin" fill="#d90429"/></g></g>
      <g transform="translate(880 0) scale(1.15)"><g class="fall" style="animation-duration:10s;animation-delay:-2s"><use href="#petal" xlink:href="#petal" class="spin" style="animation-duration:3.6s"/></g></g>
      <g transform="translate(960 0)"><g class="fall" style="animation-duration:13s;animation-delay:-9s"><use href="#petal" xlink:href="#petal" class="spin" fill="#9a9ca5"/></g></g>
      <g transform="translate(1025 0) scale(.9)"><g class="fall" style="animation-duration:11s;animation-delay:-5s"><use href="#petal" xlink:href="#petal" class="spin" style="animation-duration:2.8s"/></g></g>
      <g transform="translate(565 0) scale(.75)"><g class="fall" style="animation-duration:14s;animation-delay:-3s"><use href="#petal" xlink:href="#petal" class="spin" fill="#d90429"/></g></g>
      <g transform="translate(760 0) scale(1.1)"><g class="fall" style="animation-duration:10.5s;animation-delay:-8.5s"><use href="#petal" xlink:href="#petal" class="spin" style="animation-duration:3.2s"/></g></g>
      <g transform="translate(920 0) scale(.85)"><g class="fall" style="animation-duration:12.5s;animation-delay:-.5s"><use href="#petal" xlink:href="#petal" class="spin" fill="#9a9ca5"/></g></g>
      <g transform="translate(1000 0)"><g class="fall" style="animation-duration:9.5s;animation-delay:-6s"><use href="#petal" xlink:href="#petal" class="spin" style="animation-duration:2.2s"/></g></g>
      <g transform="translate(480 0) scale(.7)" opacity=".55"><g class="fall" style="animation-duration:15s;animation-delay:-10s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
      <g transform="translate(860 0) scale(.95)"><g class="fall" style="animation-duration:11.5s;animation-delay:-11s"><use href="#petal" xlink:href="#petal" class="spin" fill="#ff3b4e" style="animation-duration:3.4s"/></g></g>
      <g transform="translate(685 0) scale(1.05)"><g class="fall" style="animation-duration:13.5s;animation-delay:-12s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
      <g transform="translate(1060 0) scale(.8)"><g class="fall" style="animation-duration:12s;animation-delay:-3.5s"><use href="#petal" xlink:href="#petal" class="spin" fill="#9a9ca5"/></g></g>
    </g>

    <!-- text -->
    <text class="sans kicker" x="64" y="80">こんにちは, I'm</text>
    <path class="name" pathLength="1" d="M74 151.7Q81.1 155.8 90.5 158.1Q99.9 160.4 108 160.4Q116.3 160.4 119.7 158.9Q123.1 157.5 123.1 155.8Q123.1 149.7 104.5 149.7Q84.1 149.7 74.9 145.4Q65.7 141.2 65.7 131.7Q65.7 118.2 76.9 111.8Q88.1 105.4 106 105.4Q116.4 105.4 127.4 108Q138.3 110.7 147.1 115.3Q144.2 121.9 141 131.4Q140.4 133.4 140 134.4Q134.9 130.3 124.6 127.6Q114.3 124.8 106.4 124.8Q96.9 124.8 93.6 126Q90.3 127.3 90.3 129.7Q90.3 132.1 94.8 133.6Q99.4 135 108 135Q129.2 135 138.8 139.8Q148.4 144.7 148.4 154.7Q148.4 168.7 138.2 174.8Q128 181 107.3 181Q96.2 181 84.7 178.6Q73.2 176.1 64 171.4Q67.4 166.3 69.7 161.9Q71.9 157.5 74 151.7ZM211.9 164.6 220.5 125.4H240.4L229.3 180H202.6L196.3 154.5L189.2 180H163.5L152.4 125.4H172.3L180.8 164.5L186.6 125.4H206.3ZM308.5 163.4Q308.5 166.8 309.3 168.2Q310.1 169.6 312.5 170.2L312.1 179.6Q308.9 180.1 306.5 180.3Q304.2 180.5 300.3 180.5Q291.7 180.5 288.9 176.7Q286.1 172.8 286.1 166.8V164.3Q283.2 172.5 277.6 176.5Q272.1 180.5 263.5 180.5Q253.5 180.5 248.4 176.5Q243.4 172.5 243.4 164.6Q243.4 158.1 247.7 154.4Q252 150.7 261 149.3Q253.4 143.9 245.8 139.9Q251.8 132.3 259.5 128.4Q267.2 124.4 278.2 124.4Q293.6 124.4 301.1 131.1Q308.5 137.7 308.5 151.5ZM264.3 148.8Q270.3 148.1 279.3 148.1Q283 148.1 284.5 147.2Q286 146.3 286 144.9Q286 143.7 284.5 142.8Q283 142 280.3 142Q275.2 142 271.3 143.7Q267.4 145.4 264.3 148.8ZM286.1 156.4V153.8Q283.7 155 280.8 155.7Q277.9 156.3 273.8 156.9L270.2 157.5Q264.6 158.6 264.6 161.3Q264.6 164.2 269.8 164.2Q275.4 164.2 279.9 162.1Q284.4 159.9 286.1 156.4ZM341.7 140.2Q345.9 125.1 362.6 125.1Q365.5 125.1 368.2 125.5L365 147.9Q357.8 145.2 353.2 145.2Q347.5 145.2 344.8 148.6Q342.1 152 342.1 157.7V157.6L342 164.2Q342 171.3 342.4 180H318.5Q319.3 165.6 319.3 152.8Q319.3 140 318.5 125.4Q325.1 125.7 328.6 125.7Q332.3 125.7 338.7 125.4Z"/>
    <text class="sans tagline" x="64" y="226">Developer · Hobbyist · Anime Enjoyer</text>
    <text class="mono prompt" x="64" y="266">$ into</text>
    <text class="mono word first" x="142" y="266" style="animation-delay:2s">anime<tspan class="caret">_</tspan></text>
    <text class="mono word" x="142" y="266" style="animation-delay:4.5s">gaming<tspan class="caret">_</tspan></text>
    <text class="mono word" x="142" y="266" style="animation-delay:7s">tech<tspan class="caret">_</tspan></text>
    <text class="mono word" x="142" y="266" style="animation-delay:9.5s">coding<tspan class="caret">_</tspan></text>
    <text class="mono word" x="142" y="266" style="animation-delay:12s">music<tspan class="caret">_</tspan></text>
  </g>
</svg>
