<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-labelledby="title">
  <title id="title">Thanks for stopping by</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
    .bye  { font-size: 26px; font-weight: 700; fill: #f5f5f7; }
    .note { font-size: 18px; fill: #f5f5f7; letter-spacing: 2px; }
    .fall { animation: fall linear infinite both; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
    @keyframes fall {
      0%   { transform: translate(0, -15px); opacity: 0; }
      10%  { opacity: .9; }
      50%  { transform: translate(-50px, 60px); }
      90%  { opacity: .9; }
      100% { transform: translate(-110px, 135px); opacity: 0; }
    }
    @keyframes spin {
      0%   { transform: rotate(0deg) scaleX(1); }
      50%  { transform: rotate(180deg) scaleX(.35); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall { display: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141720"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="120" rx="18"/></clipPath>
    <path id="petal" d="M0 0C3-5 10-6 14-1C10 4 3 5 0 0Z"/>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="120" fill="url(#sky)"/>
    <path d="M0 120V104C160 92 330 98 500 104S840 112 1000 96V120Z" fill="#030304"/>
    <g fill="#e5e5e5">
      <g transform="translate(180 0) scale(0.9)"><g class="fall" style="animation-duration:11s;animation-delay:-2s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
      <g transform="translate(330 0) scale(0.7)"><g class="fall" style="animation-duration:9s;animation-delay:-6s"><use href="#petal" xlink:href="#petal" class="spin" fill="#ff3b4e"/></g></g>
      <g transform="translate(470 0) scale(1)"><g class="fall" style="animation-duration:13s;animation-delay:-4s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
      <g transform="translate(610 0) scale(0.8)"><g class="fall" style="animation-duration:10s;animation-delay:-8s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
      <g transform="translate(760 0) scale(0.9)"><g class="fall" style="animation-duration:12s;animation-delay:-1s"><use href="#petal" xlink:href="#petal" class="spin" fill="#ff3b4e"/></g></g>
      <g transform="translate(900 0) scale(0.75)"><g class="fall" style="animation-duration:11s;animation-delay:-5s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
      <g transform="translate(1040 0) scale(1)"><g class="fall" style="animation-duration:14s;animation-delay:-9s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g>
    </g>
    <circle cx="500" cy="38" r="7" fill="#ff3b4e"/>
    <text class="mono note" x="500" y="74" text-anchor="middle">thanks for stopping by</text>
  </g>
</svg>
