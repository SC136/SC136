    <circle class="halo" cx="420" cy="56" r="42" fill="#d90429" opacity=".35" filter="url(#blur)"/><g class="disc"><circle cx="420" cy="56" r="40" fill="#0b0c10"/><circle cx="420" cy="56" r="34" fill="none" stroke="#2a2d36" stroke-width="1"/><circle cx="420" cy="56" r="29" fill="none" stroke="#2a2d36" stroke-width="1"/><circle cx="420" cy="56" r="24" fill="none" stroke="#2a2d36" stroke-width="1"/><circle cx="420" cy="56" r="19" fill="none" stroke="#2a2d36" stroke-width="1"/><path d="M420 20A36 36 0 0 1 453 40" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/><circle cx="420" cy="56" r="13" fill="url(#moon)"/><circle cx="420" cy="56" r="2.5" fill="#0b0c10"/></g>
    <path d="M250 200C330 184 410 180 480 186V200Z" fill="#030304"/>
    <g fill="#e5e5e5"><g transform="translate(360 0) scale(0.8)"><g class="fall" style="animation-duration:9s;animation-delay:-4.5s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g><g transform="translate(430 0) scale(0.9)"><g class="fall" style="animation-duration:11s;animation-delay:-7.5s"><use href="#petal" xlink:href="#petal" class="spin" fill="#ff3b4e"/></g></g><g transform="translate(300 0) scale(0.6)"><g class="fall" style="animation-duration:12s;animation-delay:-8.0s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g></g>
