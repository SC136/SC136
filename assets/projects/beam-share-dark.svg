<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title">
  <title id="title">beam-share: Terminal UI for peer-to-peer file sharing on your local network.</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
    .desc { font-size: 15.5px; fill: #b8bcc6; }
    .tag  { font-size: 13px; fill: #8b919c; }
    .foot { font-size: 13px; fill: #ff3b4e; font-weight: 600; }
    .star { fill: #fff; animation: twinkle 4s ease-in-out infinite alternate; }
    .halo { animation: pulse 6s ease-in-out infinite alternate; }
    .link { animation: flow .9s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
    .float { animation: float 5s ease-in-out infinite alternate; }
    .disc { transform-box: fill-box; transform-origin: center; animation: turn 4s linear infinite; }
    @keyframes turn  { to { transform: rotate(360deg); } }
    .bar  { transform-box: fill-box; transform-origin: bottom; animation: eq ease-in-out infinite alternate; }
    @keyframes flow  { to { stroke-dashoffset: -22; } }
    @keyframes ring  { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
    @keyframes float { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
    @keyframes eq    { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
    .fall { animation: fall linear infinite both; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
    @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }
    @keyframes pulse   { from { opacity: .15; } to { opacity: .35; } }
    @keyframes fall {
      0%   { transform: translate(0, -15px); opacity: 0; }
      10%  { opacity: .9; }
      50%  { transform: translate(-60px, 100px); }
      90%  { opacity: .9; }
      100% { transform: translate(-130px, 220px); opacity: 0; }
    }
    @keyframes spin {
      0%   { transform: rotate(0deg) scaleX(1); }
      50%  { transform: rotate(180deg) scaleX(.35); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall { display: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset="1" stop-color="#141720"/>
    </linearGradient>
    <radialGradient id="moon" cx=".4" cy=".36" r=".72">
      <stop offset="0" stop-color="#ff4b5c"/>
      <stop offset=".6" stop-color="#d90429"/>
      <stop offset="1" stop-color="#8d0801"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="480" height="200" rx="16"/></clipPath>
    <path id="petal" d="M0 0C3-5 10-6 14-1C10 4 3 5 0 0Z"/>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="480" height="200" fill="url(#sky)"/>
    <circle class="star" cx="250" cy="22" r="1.2" style="animation-delay:-0.0s"/><circle class="star" cx="300" cy="52" r="1" style="animation-delay:-0.7s"/><circle class="star" cx="350" cy="18" r="1.4" style="animation-delay:-1.4s"/><circle class="star" cx="215" cy="60" r="1" style="animation-delay:-2.1s"/><circle class="star" cx="468" cy="110" r="1.1" style="animation-delay:-2.8s"/><circle class="star" cx="330" cy="90" r="1" style="animation-delay:-3.5s"/>
    <circle class="halo" cx="406" cy="62" r="42" fill="#d90429" opacity=".35" filter="url(#blur)"/><path d="M364 84Q404 28 448 44" fill="none" stroke="#f5f5f7" stroke-opacity=".15" stroke-width="1.5"/><path class="link" d="M364 84Q404 28 448 44" fill="none" stroke="#ff3b4e" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10"/><circle class="ring" cx="364" cy="84" r="9" fill="none" stroke="#ff3b4e" stroke-width="1.5"/><circle class="ring" cx="448" cy="44" r="12" fill="none" stroke="#ff3b4e" stroke-width="1.5" style="animation-delay:-1s"/><circle cx="364" cy="84" r="9" fill="url(#moon)"/><circle cx="448" cy="44" r="12" fill="url(#moon)"/>
    <path d="M250 200C330 184 410 180 480 186V200Z" fill="#030304"/>
    <g fill="#e5e5e5"><g transform="translate(360 0) scale(0.8)"><g class="fall" style="animation-duration:9s;animation-delay:-6.5s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g><g transform="translate(430 0) scale(0.9)"><g class="fall" style="animation-duration:11s;animation-delay:-3.5s"><use href="#petal" xlink:href="#petal" class="spin" fill="#ff3b4e"/></g></g><g transform="translate(300 0) scale(0.6)"><g class="fall" style="animation-duration:12s;animation-delay:-8.0s"><use href="#petal" xlink:href="#petal" class="spin"/></g></g></g>
