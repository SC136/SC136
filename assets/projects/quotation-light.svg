<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title">
  <title id="title">Quotation: A minimalist social network for sharing and discovering meaningful quotes.</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
    .desc { font-size: 15.5px; fill: #3b3f48; }
    .tag  { font-size: 13px; fill: #6b6f78; }
    .foot { font-size: 13px; fill: #c1121f; font-weight: 600; }
    .star { fill: #fff; animation: twinkle 4s ease-in-out infinite alternate; }
    .halo { animation: pulse 6s ease-in-out infinite alternate; }
    .fall { animation: fall linear infinite both; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
    @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }
    @keyframes pulse   { from { opacity: .25; } to { opacity: .3; } }
    @keyframes fall {
      0%   { transform: translate(0, -15px); opacity: 0; }
      10%  { opacity: .9; }
      50%  { transform: translate(-60px, 100px); }
      90%  { opacity: .9; }
      100% { transform: translate(-130px, 220px); opacity: 0; }
    }
    @keyframes spin {
      0%   { transform: rotate(0deg) scaleX(1); }
      50%  { transform: rotate(180deg) scaleX(.35); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall { display: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#efe8dc"/>
    </linearGradient>
    <radialGradient id="moon" cx=".4" cy=".36" r=".72">
      <stop offset="0" stop-color="#ff4b5c"/>
      <stop offset=".6" stop-color="#d90429"/>
      <stop offset="1" stop-color="#8d0801"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="480" height="200" rx="16"/></clipPath>
    <path id="petal" d="M0 0C3-5 10-6 14-1C10 4 3 5 0 0Z"/>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="480" height="200" fill="url(#sky)"/>
    
    <circle class="halo" cx="442" cy="34" r="58" fill="#ff4b5c" filter="url(#blur)"/>
    <circle cx="442" cy="34" r="50" fill="url(#moon)"/>
    <path d="M250 200C330 184 410 180 480 186V200Z" fill="#111318"/>
